name: Sync and translate

concurrency:
  group: sync-and-translate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  repository_dispatch:
    types:
      - release
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      branch:
        type: string
        required: false
        default: "none"

permissions:
  contents: read

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    env:
      EMQX_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || github.event.inputs.version }}
      EMQX_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch || github.event.inputs.branch }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create PR to update desc.en.hocon
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euxo pipefail
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          EMQX_VERSION_MAJOR_MINOR=$(echo ${EMQX_VERSION##[e|v]} | awk -F. '{print $1$2}')
          BASE_BRANCH="v${EMQX_VERSION_MAJOR_MINOR}"
          NEW_BRANCH="sync-and-translate-for-${EMQX_VERSION}"
          git fetch origin
          if [ "${EMQX_BRANCH}" != "none" ]; then
            EMQX_REPO_CHECKOUT_REF=${EMQX_BRANCH}
          else
            EMQX_REPO_CHECKOUT_REF=${EMQX_VERSION}
          fi
          git checkout -b ${NEW_BRANCH} --track origin/${BASE_BRANCH}
          BASE_REF=$(git rev-parse origin/${BASE_BRANCH})
          COMMIT_BEFORE_TR=$(git rev-parse HEAD)
          ./tr/run.sh --emqx-ref ${EMQX_REPO_CHECKOUT_REF} --compare-base ${BASE_REF}
          COMMIT_AFTER_TR=$(git rev-parse HEAD)
          if [ "${COMMIT_BEFORE_TR}" = "${COMMIT_AFTER_TR}" ]; then
            echo "No new transaction, not creating a new PR"
          else
            git push origin ${NEW_BRANCH}:${NEW_BRANCH}
            REL_VERSION=$(echo "${EMQX_VERSION##[e|v]}" | cut -d '-' -f 1)
            TITLE="sync and translate for ${REL_VERSION}"
            # close all open PRs with the same title
            for pr in $(gh pr list --state open --base ${BASE_BRANCH} --label sync-and-translate --search "${TITLE} in:title" --repo ${{ github.repository }} --json number --jq '.[] | .number'); do
              gh pr close $pr --repo ${{ github.repository }} --delete-branch || true
            done
            # create a new PR
            gh pr create --title "${TITLE}" --base ${BASE_BRANCH} --head ${NEW_BRANCH} --body '' --label sync-and-translate --repo ${{ github.repository }}
          fi
